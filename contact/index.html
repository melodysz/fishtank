<div class="page-wrapper">
  <div class="contact-card">

    <!-- left: hello + other ways to reach me -->
    <div class="contact-intro">
      <h1 class="contact-title">Let's <em>chat!</em></h1>
      <p>Have a project, a role, or just a fun idea? Drop me a line and I'll get back to you as soon as I can.</p>
      <div class="contact-alt">
        <span class="contact-alt-label">or find me at</span>
        <a href="mailto:melodyserenazhang@gmail.com" class="interactable contact-alt-link">melodyserenazhang@gmail.com</a>
        <a href="https://www.linkedin.com/in/melody-zhang-90605b217/" target="_blank" class="interactable contact-alt-link">LinkedIn ↗</a>
      </div>
    </div>

    <!-- right: the form, swapped for a receipt once it's sent -->
    <div class="contact-form-col">
      <form class="contact-form" id="contactForm" novalidate>
        <div class="field-row">
          <label class="field">
            <span class="field-label">Name <i>*</i></span>
            <input type="text" name="name" autocomplete="name" required>
          </label>
          <label class="field">
            <span class="field-label">Email <i>*</i></span>
            <input type="email" name="email" autocomplete="email" required>
          </label>
        </div>
        <label class="field">
          <span class="field-label">Company / organization</span>
          <input type="text" name="company" autocomplete="organization">
        </label>
        <label class="field">
          <span class="field-label">Subject <i>*</i></span>
          <input type="text" name="subject" required>
        </label>
        <label class="field">
          <span class="field-label">Message <i>*</i></span>
          <textarea name="message" rows="6" required></textarea>
        </label>

        <!-- hidden trap for spam bots: people never see or fill this -->
        <input type="text" name="_honey" class="contact-honey" tabindex="-1" autocomplete="off">

        <label class="receipt-check interactable">
          <input type="checkbox" name="wants_receipt" checked>
          <span class="receipt-box" aria-hidden="true"></span>
          <span>Email me a receipt, so I know it sent and can look back on what I wrote</span>
        </label>

        <div class="form-bottom">
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
          <button type="submit" class="send-btn interactable" id="sendBtn">send it!</button>
        </div>
      </form>

      <!-- shown after a successful send -->
      <div class="contact-receipt" id="contactReceipt" hidden>
        <div class="receipt-paper">
          <p class="receipt-head">✶ message received ✶</p>
          <p class="receipt-sub" id="receiptTime"></p>
          <div class="receipt-rule"></div>
          <dl class="receipt-lines">
            <div><dt>from</dt><dd id="rFrom"></dd></div>
            <div><dt>to</dt><dd>Melody Zhang</dd></div>
            <div><dt>subject</dt><dd id="rSubject"></dd></div>
          </dl>
          <div class="receipt-rule"></div>
          <p class="receipt-message" id="rMessage"></p>
          <div class="receipt-rule"></div>
          <p class="receipt-foot" id="receiptFoot"></p>
        </div>
        <button type="button" class="send-btn send-btn--ghost interactable" id="againBtn">write another</button>
      </div>
    </div>

  </div>
</div>

  <!-- GSAP & Lenis Libraries (at the end, before closing </body>) -->
